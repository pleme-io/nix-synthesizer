[package]
name = "nix-synthesizer"
version = "0.1.1"
edition = "2024"
rust-version = "1.89.0"
description = "Typed AST for structurally correct Nix expression generation"
license = "MIT"
repository = "https://github.com/pleme-io/nix-synthesizer"

[features]
default = []
iac-bridge = ["dep:iac-forge"]

[dependencies]
iac-forge = { version = "0.1", optional = true }
synthesizer-core = "0.1"

[dev-dependencies]
proptest = "1"
regex = "1"
iac-forge = "0.1"
